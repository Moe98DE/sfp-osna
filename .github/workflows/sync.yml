name: Instagram publishing
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publishing-${{ github.repository }}-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.INSTAGRAM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://example.org' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Import new posts
        id: sync
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
          INSTAGRAM_MAX_PAGES: ${{ vars.INSTAGRAM_MAX_PAGES || '2' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
        run: npm run sync
      - name: Detect changes
        id: changes
        run: |
          git add src/content/posts public/media/posts review
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Save validated imports
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: import new Instagram posts"
          git push origin HEAD:main
      - name: Deploy current build
        if: steps.sync.outcome == 'success' && vars.DEPLOY_NEOCITIES == 'true'
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: npm run deploy
      - name: Report import failures
        if: always() && steps.sync.outcome == 'failure'
        run: |
          echo "Some imports failed. Valid articles and review drafts were retained if validation and push succeeded. Inspect the sync log."
          exit 1
